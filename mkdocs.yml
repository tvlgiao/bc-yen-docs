site_name: "Yen BigCommerce Theme User Guide"
site_url: "https://bc-yen-docs.papathemes.com"
site_description: "Merchant guide for the Yen BigCommerce theme by PapaThemes — install it, pick a variation, configure the Theme Editor, and set up the Lookbook and Page Builder hero."
site_author: "PapaThemes"

nav:
  - Home: index.md
  - Getting Started:
    - usage/install.md
    - usage/choose-variation.md
  - Configuring the Theme:
    - usage/theme-editor.md
    - usage/lookbook.md
    - usage/page-templates.md
    - usage/page-builder.md
  - Settings Reference: settings-reference.md
  - Troubleshooting: troubleshooting.md
  - Support: support.md

theme:
  name: material
  custom_dir: overrides
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    # The "follow the system" entry needs its own colours too. Without them Material falls
    # back to its default indigo, so a visitor who has never touched the toggle sees a
    # palette that is nothing to do with the theme being documented.
    - media: "(prefers-color-scheme)"
      primary: black
      accent: deep orange
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Source Sans 3
    code: IBM Plex Mono

plugins:
  - search:
      separator: '[\s\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

use_directory_urls: false

extra_css:
  - css/style.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      separator: "-"
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
